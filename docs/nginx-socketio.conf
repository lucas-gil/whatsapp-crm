# Recommended Nginx configuration snippet for Socket.IO behind a reverse proxy
# Place this in your server block (replace example domain)

# Upstream is optional if using proxy_pass to unix/socket or other backend

# Ensure websocket upgrade headers and correct proxy_http_version
location /socket.io/ {
    proxy_pass http://127.0.0.1:3000/socket.io/; # backend Socket.IO (Nest) endpoint
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_connect_timeout 60s;
}

# If your Socket.IO client connects to a namespace like /whatsapp, the above
# path still applies because Socket.IO uses /socket.io for transport. Ensure
# client uses the same host (wss://yourdomain) and path `/socket.io`.

